<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a1f16">
<link rel="manifest" href="/manifest.json">
<title>Ludo Online</title>
<style>
:root{--blue:#1f6fb8;--green:#68a92c;--red:#e01b2c;--yellow:#f3cf00}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1f16;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:radial-gradient(circle at 50% 40%,#4a3424,#1d150e 75%)}
#bar{display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:46px}
#bar button{flex:none}
#status{flex:1;text-align:center;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#code{font-size:12px;opacity:.8;letter-spacing:1px}
.ib{width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib:active{background:rgba(255,255,255,.22)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:4px}
#board{position:relative;border-radius:1.5%;box-shadow:0 10px 40px rgba(0,0,0,.6);
  background-color:#e8b886;
  background-image:repeating-linear-gradient(90deg,rgba(140,80,30,.10) 0 2px,transparent 2px 6px,rgba(255,255,255,.10) 6px 8px,transparent 8px 13px,rgba(120,70,30,.07) 13px 14px,transparent 14px 21px),
  linear-gradient(180deg,#f0c597,#dfa672)}
#board svg{width:100%;height:100%;display:block}
.pc{cursor:pointer;transition:transform .13s ease-out}
.pc.jump{transition:transform .35s ease-in-out}
.pc .ring{opacity:0;fill:none;stroke:#fff;stroke-width:.09}
.pc.can .ring{opacity:1;animation:pulse .7s infinite alternate}
@keyframes pulse{from{stroke-opacity:1;stroke-width:.12}to{stroke-opacity:.3;stroke-width:.05}}
.base.turn{animation:glow .8s infinite alternate}
@keyframes glow{from{stroke:#fff;stroke-width:.16}to{stroke:#fff;stroke-width:.04}}
#dice{cursor:pointer}
#dice.ready rect{animation:dready .6s infinite alternate}
@keyframes dready{from{stroke-width:.08}to{stroke-width:.17}}
#dice.rolling{animation:wob .15s infinite alternate}
@keyframes wob{from{transform:translate(7.5px,7.5px) rotate(-14deg)}to{transform:translate(7.5px,7.5px) rotate(14deg)}}
.lbl{font-size:.52px;font-weight:700;fill:#3a2412;paint-order:stroke;stroke:rgba(255,235,210,.7);stroke-width:.08px}
.lbl.turn{fill:#000;font-size:.6px}
/* overlays */
.ov{position:absolute;inset:0;top:calc(52px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;background:rgba(15,10,6,.72);z-index:10;padding:14px;overflow:auto}
.card{background:#fbf6ee;color:#2a1d12;border-radius:18px;padding:20px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.card h1{margin:0 0 4px;font-size:34px;letter-spacing:1px;text-align:center}
.card h2{margin:0 0 12px;font-size:20px;text-align:center}
.card p{margin:6px 0;font-size:14px;line-height:1.4;color:#5a4634}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.dots span{width:16px;height:16px;border-radius:50%}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;background:#2a1d12;color:#fff}
.btn.alt{background:#e9dccb;color:#2a1d12}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:stretch}
.row .btn{margin-top:0}
input.tx{width:100%;padding:12px;border-radius:12px;border:2px solid #d9c8b2;font-size:16px;background:#fff;color:#2a1d12;user-select:text;-webkit-user-select:text}
input.tx:focus{outline:none;border-color:#2a1d12}
label.sm{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#8a7258;display:block;margin:12px 0 4px}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seat{border-radius:12px;padding:10px;color:#fff;min-height:96px;display:flex;flex-direction:column;gap:6px}
.seat.yellow{color:#2a1d12}
.seat .nm{font-weight:800;font-size:15px}
.seat .who{font-size:13px;opacity:.95;min-height:18px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:6px 4px;border-radius:8px;border:0;font-size:12px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.3);color:inherit}
.seg button.on{background:#fff;color:#2a1d12}
.bigcode{font-size:38px;font-weight:900;letter-spacing:8px;text-align:center;margin:4px 0;color:#2a1d12}
.note{font-size:12px;color:#8a7258;text-align:center;margin-top:10px}
.ol{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.oli{display:flex;align-items:center;gap:8px;background:#f1e7da;border-radius:10px;padding:8px 10px;font-size:14px}
.oli .d{width:10px;height:10px;border-radius:50%;background:#3bb54a;flex:none}
.oli .n{font-weight:700}
.oli .s{flex:1;font-size:12px;color:#7a6550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oli button{border:0;border-radius:8px;background:#2a1d12;color:#fff;font-weight:700;padding:7px 12px;cursor:pointer;font-size:13px}
.oli button:disabled{opacity:.4}
.empty{font-size:13px;color:#8a7258;text-align:center;padding:8px}
#invite{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:30;background:#fbf6ee;color:#2a1d12;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;width:min(420px,94%);font-size:14px}
#invite button{border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#menu{position:absolute;top:50px;left:8px;z-index:15;background:#fbf6ee;color:#2a1d12;border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;min-width:200px}
#menu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;font-size:15px;border-radius:8px;cursor:pointer;color:inherit}
#menu button:hover{background:#efe3d3}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button class="ib" id="menuBtn" title="Menu">☰</button>
    <span id="code"></span>
    <div id="status">Ludo</div>
    <button class="ib" id="musBtn" title="Música">🎵</button>
    <button class="ib" id="sndBtn" title="Efeitos sonoros">🔊</button>
    <button class="ib" id="fsBtn" title="Tela cheia">⛶</button>
  </div>
  <div id="menu">
    <button id="mRules">📖 Regras</button>
    <button id="mCopy">🔗 Copiar link da sala</button>
    <button id="mLeave">🚪 Sair da partida</button>
  </div>
  <div id="stage">
    <div id="board"><svg id="svg" viewBox="-0.4 -0.4 15.8 15.8" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
  <div class="ov" id="ov"></div>
  <div id="toast"></div>
  <div id="invite" class="hidden"><span id="invTx" style="flex:1"></span><button id="invYes" style="background:#2a1d12;color:#fff">Entrar</button><button id="invNo" style="background:#e9dccb">✕</button></div>
</div>
<script src="/rules.js"></script>
<script>
"use strict";
const {COLORS,PT,START,SAFE,HOME,TRACK,LANE,absIdx,cellRC,fresh,seatName}=LudoRules;
const HEX={blue:'#1f6fb8',green:'#68a92c',red:'#e01b2c',yellow:'#f3cf00'};
const BC={blue:[2.7,2.7],green:[2.7,12.3],red:[12.3,12.3],yellow:[12.3,2.7]};
const HO=[[-.85,-.85],[-.85,.85],[.85,-.85],[.85,.85]];
const HOMESPOT={blue:i=>[6.3,6.75+.5*i],green:i=>[6.75+.5*i,6.3],red:i=>[8.7,6.75+.5*i],yellow:i=>[6.75+.5*i,8.7]};
const LBL={blue:[2.7,5.55],green:[12.3,5.55],red:[12.3,9.8],yellow:[2.7,9.8]};
const clone=o=>JSON.parse(JSON.stringify(o));
const $=id=>document.getElementById(id);
const clean=s=>String(s||'').replace(/[\u0000-\u001f\u007f-\u009f­​-‏‪-‮⁠-⁯﻿]/g,'').trim().slice(0,14);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let G=null, authG=null, mode=null, roomCode='', isHost=false, es=null, les=null, view='home';
let myName=store.get('ludo_name')||'';
let myId=store.get('ludo_id'); if(!myId){myId=Math.random().toString(36).slice(2)+Date.now().toString(36);store.set('ludo_id',myId)}
let lobbyData={rooms:[],online:[]}, lobbyOK=false, dismissed=new Set();
let disp=fresh(), animChain=Promise.resolve(), animPending=0, lastMvId=null, lastRollId=null, diceRolling=false, animUntil=0;
let timer=null, sound=true, audioCtx=null, roomInfo={};
const urlCode=(new URLSearchParams(location.search).get('sala')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);

/* ================= DESENHO DO TABULEIRO ================= */
const svg=$('svg');
function buildBoard(){
  let s='<defs><filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy=".06" stdDeviation=".05" flood-opacity=".5"/></filter></defs>';
  for(const c of COLORS){const [y,x]=BC[c];
    s+=`<circle class="base" id="base-${c}" cx="${x}" cy="${y}" r="2.15" fill="${HEX[c]}" stroke="#1a1a1a" stroke-width=".05"/>`;
    for(const o of HO)s+=`<circle cx="${x+o[1]}" cy="${y+o[0]}" r=".6" fill="#f2f2ef" stroke="#1a1a1a" stroke-width=".03"/>`;
  }
  const cell=(r,c,f)=>`<rect x="${c}" y="${r}" width="1" height="1" fill="${f}" stroke="#1d1d1d" stroke-width=".045"/>`;
  for(const [r,c] of TRACK)s+=cell(r,c,'#f5f5f2');
  for(const c of COLORS)for(const [r,cc] of LANE[c])s+=cell(r,cc,HEX[c]);
  s+=`<polygon points="6,6 6,9 7.5,7.5" fill="${HEX.blue}"/><polygon points="6,6 9,6 7.5,7.5" fill="${HEX.green}"/>`+
     `<polygon points="9,6 9,9 7.5,7.5" fill="${HEX.red}"/><polygon points="6,9 9,9 7.5,7.5" fill="${HEX.yellow}"/>`+
     `<path d="M6,6 9,9 M9,6 6,9" stroke="#1d1d1d" stroke-width=".04"/><rect x="6" y="6" width="3" height="3" fill="none" stroke="#1d1d1d" stroke-width=".05"/>`;
  // setas de saída
  const arrow=(c,rot)=>{const [r,cc]=TRACK[START[c]];return `<path transform="translate(${cc+.5} ${r+.5}) rotate(${rot})" d="M-.3,-.2 L.3,0 L-.3,.2 L-.15,0Z" fill="${HEX[c]}" stroke="#1d1d1d" stroke-width=".02"/>`};
  s+=arrow('blue',0)+arrow('green',90)+arrow('red',180)+arrow('yellow',270);
  for(const c of COLORS){const [x,y]=LBL[c];s+=`<text class="lbl" id="lbl-${c}" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle"></text>`}
  s+='<g id="pcs"></g>';
  s+='<g id="dice" style="transform:translate(7.5px,7.5px)"><rect x="-.62" y="-.62" width="1.24" height="1.24" rx=".22" fill="#fff" stroke="#333" stroke-width=".08"/><g id="pips"></g></g>';
  svg.innerHTML=s;
  const g=$('pcs');
  for(const c of COLORS)for(let i=0;i<4;i++){
    const e=document.createElementNS('http://www.w3.org/2000/svg','g');
    e.setAttribute('class','pc');e.dataset.c=c;e.dataset.i=i;e.id=`pc-${c}-${i}`;
    e.innerHTML=`<circle r=".55" fill="transparent"/><circle class="ring" r=".48"/>`+
      `<circle r=".36" fill="${HEX[c]}" stroke="#fff" stroke-width=".08" filter="url(#sh)"/>`+
      `<circle r=".2" fill="none" stroke="rgba(0,0,0,.25)" stroke-width=".05"/><circle cx="-.1" cy="-.11" r=".08" fill="rgba(255,255,255,.55)"/>`;
    e.addEventListener('click',ev=>{ev.stopPropagation();onPieceClick(c,i)});
    g.appendChild(e);
  }
  $('dice').addEventListener('click',onDiceClick);
}
function drawPips(v,color){
  const P={1:[[0,0]],2:[[-.3,-.3],[.3,.3]],3:[[-.3,-.3],[0,0],[.3,.3]],4:[[-.3,-.3],[.3,-.3],[-.3,.3],[.3,.3]],
    5:[[-.3,-.3],[.3,-.3],[0,0],[-.3,.3],[.3,.3]],6:[[-.3,-.3],[.3,-.3],[-.3,0],[.3,0],[-.3,.3],[.3,.3]]};
  $('pips').innerHTML=(P[v]||[]).map(([x,y])=>`<circle cx="${x}" cy="${y}" r=".12" fill="#222"/>`).join('');
  $('dice').querySelector('rect').setAttribute('stroke',color||'#333');
}
function layoutPieces(){
  const groups={};
  const spots=[];
  for(const c of COLORS)for(let i=0;i<4;i++){
    const p=disp[c][i];let x,y,key=null,sc=1;
    if(!G||!G.act||(G.phase!=='lobby'&&!G.act.includes(c))){ $(`pc-${c}-${i}`).style.display='none';continue }
    $(`pc-${c}-${i}`).style.display='';
    if(p===-1){const [by,bx]=BC[c];x=bx+HO[i][1];y=by+HO[i][0];sc=1.25}
    else if(p===HOME){[x,y]=HOMESPOT[c](i);sc=.6}
    else{const [r,cc]=cellRC(c,p);x=cc+.5;y=r+.5;key=x+','+y}
    const o={c,i,x,y,sc};spots.push(o);
    if(key)(groups[key]=groups[key]||[]).push(o);
  }
  const OFF={2:[[-.2,-.2],[.2,.2]],3:[[-.2,-.2],[.2,-.2],[0,.2]],4:[[-.2,-.2],[.2,-.2],[-.2,.2],[.2,.2]]};
  for(const k in groups){const a=groups[k];if(a.length<2)continue;
    a.forEach((o,j)=>{const of=(OFF[Math.min(a.length,4)]||OFF[4])[j%4];o.x+=of[0];o.y+=of[1];o.sc=.72})}
  for(const o of spots){const e=$(`pc-${o.c}-${o.i}`);e.style.transform=`translate(${o.x}px,${o.y}px) scale(${o.sc})`}
}



/* ================= MODO LOCAL (este aparelho manda) ================= */
function commit(){authG.v++;onState(clone(authG));schedule()}
function schedule(){
  clearTimeout(timer);if(mode!=='local'||!authG||authG.phase!=='play')return;
  const g=authG,wait=Math.max(0,animUntil-Date.now()),auto=g.seats[g.turn].t==='c';
  if(g.st==='roll'&&auto)timer=setTimeout(()=>act({t:'roll'}),wait+700);
  else if(g.st==='move'){const distinct=new Set(g.movable.map(i=>g.pcs[g.turn][i]));
    if(auto)timer=setTimeout(()=>act({t:'move',p:LudoRules.cpuPick(g)}),wait+900);
    else if(distinct.size===1)timer=setTimeout(()=>act({t:'move',p:g.movable[0]}),wait+850);
  }else if(g.st==='pass')timer=setTimeout(()=>{LudoRules.nextTurn(authG);commit()},wait+1400);
}
function act(a){const g=authG;if(!g||g.phase!=='play')return;
  if(a.t==='roll'&&g.st==='roll')LudoRules.doRoll(g);
  else if(a.t==='move'&&g.st==='move'&&g.movable.includes(a.p)){LudoRules.doMove(g,a.p);animUntil=Date.now()+g.mv.path.length*140+(g.mv.cap.length?450:0)+150}
  else return;commit()}

/* ================= SERVIDOR ================= */
async function api(path,body){
  try{const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({code:roomCode,id:myId,name:myName},body))});
    const j=await r.json().catch(()=>({}));if(!r.ok&&j.err)toast(j.err);return j}
  catch(e){toast('Sem conexão com o servidor');return {err:'net'}}
}
function iControl(g,c){if(!g)return false;const s=g.seats[c];if(!s)return false;return g.mode==='local'?s.t==='h':(s.t==='h'&&s.me)}
function myAction(a){
  if(!G||G.phase!=='play'||!iControl(G,G.turn)||animPending||diceRolling)return;
  if(a.t==='roll'&&G.st!=='roll')return;
  if(a.t==='move'&&(G.st!=='move'||!G.movable.includes(a.p)))return;
  audio();if(mode==='local')act(a);else api('act',{a});
}
function onState(ng){
  const prev=G;G=ng;
  if(!prev||ng.phase==='lobby'||(ng.phase==='play'&&prev.phase!=='play')){disp=clone(ng.pcs);lastMvId=ng.mv?ng.mv.id:null;lastRollId=ng.rollId}
  if(ng.mv&&ng.mv.id!==lastMvId){lastMvId=ng.mv.id;queueMove(ng.mv)}
  else if(!animPending)disp=clone(ng.pcs);
  if(ng.rollId!==lastRollId){lastRollId=ng.rollId;rollDice()}
  if(prev&&prev.msg!==ng.msg&&ng.msg&&(ng.mv&&ng.mv.cap&&ng.mv.cap.length||/venceu|casa|três/.test(ng.msg)))toast(ng.msg);
  layoutPieces();renderUI();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function queueMove(mv){
  animPending++;
  animChain=animChain.then(async()=>{
    const e=$(`pc-${mv.c}-${mv.p}`);
    for(const s of mv.path){disp[mv.c][mv.p]=s;layoutPieces();beep(520+s*4,.04);await sleep(140)}
    if(mv.cap&&mv.cap.length){await sleep(120);for(const [oc,j] of mv.cap){disp[oc][j]=-1;$(`pc-${oc}-${j}`).classList.add('jump')}
      layoutPieces();beep(160,.25,'sawtooth');await sleep(400);for(const [oc,j] of mv.cap)$(`pc-${oc}-${j}`).classList.remove('jump')}
    if(disp[mv.c][mv.p]===HOME)chime();
  }).catch(()=>{}).then(()=>{animPending--;if(!animPending&&G){disp=clone(G.pcs);layoutPieces();renderUI()}});
}
function rollDice(){
  diceRolling=true;const d=$('dice');d.classList.add('rolling');const t0=Date.now();beep(300,.05);
  const iv=setInterval(()=>{drawPips(1+Math.floor(Math.random()*6),G?HEX[G.turn]:'#333');beep(200+Math.random()*200,.02)},70);
  setTimeout(()=>{clearInterval(iv);d.classList.remove('rolling');diceRolling=false;renderUI()},520);
  renderUI();
}


function rollDice(){
  diceRolling=true;const d=$('dice');d.classList.add('rolling');beep(300,.05);
  const iv=setInterval(()=>{drawPips(1+Math.floor(Math.random()*6),G?HEX[G.turn]:'#333');beep(200+Math.random()*200,.02)},70);
  setTimeout(()=>{clearInterval(iv);d.classList.remove('rolling');diceRolling=false;renderUI()},520);
  renderUI();
}

/* ================= INTERFACE ================= */
function renderUI(){
  const g=G;
  $('code').textContent=mode==='online'&&roomCode?'SALA '+roomCode:'';
  $('mCopy').classList.toggle('hidden',mode!=='online');
  for(const c of COLORS){const l=$('lbl-'+c),b=$('base-'+c);let t='';
    if(g&&g.seats[c]){const s=g.seats[c];const inGame=g.act&&g.act.includes(c)&&g.phase!=='lobby';
      if(g.phase==='lobby')t=s.t==='h'?(g.mode==='online'?(s.name||'…'):PT[c]):s.t==='c'?'CPU 🤖':s.t==='o'?'livre':'';
      else if(inGame){t=seatName(g,c);if(g.mode==='online'&&s.t==='h'&&!s.on)t+=' (saiu)';if(s.me)t+=' (você)'}}
    l.textContent=t;const turn=g&&g.phase==='play'&&g.turn===c;l.classList.toggle('turn',!!turn);b.classList.toggle('turn',!!turn)}
  const dice=$('dice');
  if(g&&g.phase==='play'){dice.style.display='';if(!diceRolling)drawPips(g.dice||0,HEX[g.turn]);
    const ready=g.st==='roll'&&iControl(g,g.turn)&&!animPending&&!diceRolling;dice.classList.toggle('ready',ready);
    if(!g.dice&&!diceRolling)$('pips').innerHTML=`<text x="0" y=".05" text-anchor="middle" dominant-baseline="middle" font-size=".34" font-weight="800" fill="#333">${ready?'JOGAR':'…'}</text>`;
  }else dice.style.display='none';
  const canMove=g&&g.phase==='play'&&g.st==='move'&&iControl(g,g.turn)&&!animPending&&!diceRolling;
  for(const c of COLORS)for(let i=0;i<4;i++)$(`pc-${c}-${i}`).classList.toggle('can',!!(canMove&&c===g.turn&&g.movable.includes(i)));
  let s='Ludo';
  if(g&&g.phase==='lobby')s=g.mode==='online'?'Sala de espera':'Preparar partida';
  else if(g&&g.phase==='play'){const nm=seatName(g,g.turn),mine=iControl(g,g.turn),who=g.mode==='local'?nm:(mine?'Sua vez':nm);
    if(diceRolling)s=`${who}: rolando…`;
    else if(g.st==='roll')s=mine?(g.mode==='local'?`${nm}: toque no dado`:'Sua vez! Toque no dado'):`Vez de ${nm}`;
    else if(g.st==='move')s=mine?`${who}: tirou ${g.dice} – escolha a peça`:`${nm} tirou ${g.dice}`;
    else s=g.msg||''}
  else if(g&&g.phase==='over')s=seatName(g,g.winner)+' venceu! 🏆';
  const st=$('status');st.textContent=s;st.style.color=g&&g.phase==='play'?{blue:'#6fb2ff',green:'#8fd14f',red:'#ff5a66',yellow:'#ffe34d'}[g.turn]:'#fff';
  renderOverlay();
}

  if(les)les.close();lobbyOK=false;

}

function joinRoom(raw){
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==4){toast('O código tem 4 letras/números');return}
  if(needName())return;audio();
  if(es)es.close();clearTimeout(timer);mode='online';roomCode=code;G=null;authG=null;isHost=false;hideBanner();renderUI();
  try{history.replaceState(null,'','?sala='+code)}catch(e){}
  es=new EventSource(`/api/stream?code=${code}&id=${encodeURIComponent(myId)}&name=${encodeURIComponent(myName)}`);
  es.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(m.err){toast(m.err);leave();return}
    isHost=m.host;roomInfo=m;onState(m.g)};
  es.onerror=()=>{if(mode==='online')$('status').textContent='Reconectando…'};
  reconnectLobbySoon();

function ctxGet(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended'&&!document.hidden)audioCtx.resume().catch(()=>{});return audioCtx}

/* ===== MÚSICA DE FUNDO (gerada pelo próprio jogo, sem arquivos) ===== */
let musicOn=store.get('ludo_music')!=='0';
const Music=(()=>{
  let master=null,echo=null,timer=null,playing=false,nextT=0,step=0;
  const E=60/76/2;                                   // colcheia a 76 bpm
  const hz=n=>440*Math.pow(2,(n-69)/12);
  // Dó maj7 – Lá m7 – Fá maj7 – Sol6 (progressão suave)
  const CH=[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,64]];
  const BASS=[36,33,29,31];
  const MEL=[[76,79,74,72],[72,76,79,81],[72,69,72,76],[74,71,79,74]];
  const PAT=[1,0,0,1,0,1,0,0];                       // em que colcheias toca a melodia
  function init(){const c=ctxGet();if(!c||master)return!!c;
    master=c.createGain();master.gain.value=0;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
    echo=c.createDelay(1);echo.delayTime.value=E*3;const fb=c.createGain();fb.gain.value=.28;const ew=c.createGain();ew.gain.value=.35;
    echo.connect(fb).connect(echo);echo.connect(ew).connect(lp);
    master.connect(lp).connect(c.destination);return true}
  function tone(f,t,d,type,vol,att,toEcho){const c=audioCtx,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);if(toEcho)g.connect(echo);o.start(t);o.stop(t+d+.05)}
  function play(st,t){const bar=Math.floor(st/8)%4,b=st%8,ch=CH[bar];
    if(b===0){for(const n of ch){tone(hz(n),t,E*8+.6,'sine',.022,.9);tone(hz(n)*1.003,t,E*8+.6,'triangle',.010,1.1)}
      tone(hz(BASS[bar]),t,E*3.5,'sine',.07,.04)}
    if(b===4)tone(hz(BASS[bar]+7),t,E*3,'sine',.05,.04);
    if(PAT[b]){const m=MEL[(Math.floor(st/32)+bar)%4][(b>>1)%4];tone(hz(m),t,1.1,'sine',.035,.02,true);tone(hz(m*1+12),t,.5,'sine',.006,.02)}
    if(b%2===1&&Math.random()<.35)tone(hz(ch[Math.floor(Math.random()*4)]+12),t,.7,'triangle',.012,.01,true)}
  function sched(){if(!playing||!audioCtx)return;const c=audioCtx;if(nextT<c.currentTime)nextT=c.currentTime+.05;
    while(nextT<c.currentTime+.6){play(step,nextT);step++;nextT+=E}}
  // Se existir o arquivo "musica.mp3" ao lado do jogo, ele é tocado em vez da música gerada
  let file=null,fileEl=null,fileGain=null,fileOn=false;
  fetch('musica.mp3',{method:'HEAD',cache:'no-store'}).then(r=>{file=r.ok&&/audio/.test(r.headers.get('content-type')||'');if(file&&playing&&!fileOn){playing=false;Music.start()}}).catch(()=>{file=false});
  function fileStart(){const c=ctxGet();
    if(!fileEl){fileEl=new Audio('musica.mp3');fileEl.loop=true;fileEl.preload='auto';
      try{const src=c.createMediaElementSource(fileEl);fileGain=c.createGain();fileGain.gain.value=0;src.connect(fileGain).connect(c.destination)}catch(e){fileGain=null;fileEl.volume=.4}}
    if(fileGain){fileGain.gain.cancelScheduledValues(c.currentTime);fileGain.gain.setValueAtTime(fileGain.gain.value,c.currentTime);fileGain.gain.linearRampToValueAtTime(.4,c.currentTime+2)}
    fileEl.play().catch(()=>{});fileOn=true}
  function fileStop(){if(!fileEl)return;fileOn=false;const c=audioCtx;
    if(fileGain&&c){fileGain.gain.cancelScheduledValues(c.currentTime);fileGain.gain.setValueAtTime(fileGain.gain.value,c.currentTime);fileGain.gain.linearRampToValueAtTime(0,c.currentTime+.6);setTimeout(()=>{if(!fileOn)fileEl.pause()},700)}
    else fileEl.pause()}
  return{
    start(){if(file&&!fileOn){if(playing){playing=false;if(master&&audioCtx){master.gain.cancelScheduledValues(audioCtx.currentTime);master.gain.setValueAtTime(0,audioCtx.currentTime)}clearInterval(timer)}fileStart();return}
      if(file)return;
      if(playing||!init())return;playing=true;const c=audioCtx;nextT=c.currentTime+.1;
      master.gain.cancelScheduledValues(c.currentTime);master.gain.setValueAtTime(master.gain.value,c.currentTime);master.gain.linearRampToValueAtTime(.55,c.currentTime+2.5);
      clearInterval(timer);timer=setInterval(sched,120);sched()},
    stop(){if(fileOn)fileStop();if(!playing)return;playing=false;const c=audioCtx;
      master.gain.cancelScheduledValues(c.currentTime);master.gain.setValueAtTime(master.gain.value,c.currentTime);master.gain.linearRampToValueAtTime(0,c.currentTime+.6);
      setTimeout(()=>{if(!playing)clearInterval(timer)},700)}};
})();
function setMusic(v){musicOn=v;store.set('ludo_music',v?'1':'0');$('musBtn').style.opacity=v?1:.45;$('musBtn').title=v?'Música: ligada':'Música: desligada';
  if(v){ctxGet();Music.start()}else Music.stop()}
$('musBtn').onclick=e=>{e.stopPropagation();setMusic(!musicOn);toast(musicOn?'🎵 Música ligada':'Música desligada')};

document.addEventListener('visibilitychange',()=>{if(!audioCtx)return;if(document.hidden)audioCtx.suspend().catch(()=>{});else audioCtx.resume().catch(()=>{})});
function beep(f,d,type){if(!sound||!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type||'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}

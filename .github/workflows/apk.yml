name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copiar o jogo para dentro do app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html rules.js manifest.json icon.svg musica.mp3 suspense.mp3 android/app/src/main/assets/www/

      - name: Compilar o APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk LudoOnline.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LudoOnline-apk
          path: LudoOnline.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Ludo Online 1.${{ github.run_number }}
          body: |
            Baixe o **LudoOnline.apk** abaixo e instale no Android.
            Contra o computador funciona sem internet; o modo online usa o servidor https://ludo-online-xvys.onrender.com
          files: LudoOnline.apk
          make_latest: true
